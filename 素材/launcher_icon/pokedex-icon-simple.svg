<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景の余白 -->
  <rect x="0" y="0" width="512" height="512" fill="white" />
  
  <!-- ポケモン図鑑の本体 -->
  <rect x="106" y="106" width="300" height="300" rx="30" ry="30" fill="#CC0000" />
  
  <!-- 中央の黒いライン -->
  <rect x="251" y="106" width="10" height="300" fill="#222222" />
  
  <!-- 左側パネル -->
  <rect x="121" y="121" width="115" height="270" rx="10" ry="10" fill="#D50000" />
  
  <!-- 右側パネル -->
  <rect x="276" y="121" width="115" height="270" rx="10" ry="10" fill="#D50000" />
  
  <!-- 左側の画面部分 -->
  <rect x="136" y="151" width="85" height="110" rx="5" ry="5" fill="#222222" />
  
  <!-- 左側の画面の内側 -->
  <rect x="141" y="156" width="75" height="100" rx="3" ry="3" fill="#7CFC00" />
  
  <!-- 右側の画面部分 -->
  <rect x="291" y="151" width="85" height="110" rx="5" ry="5" fill="#222222" />
  
  <!-- 右側の画面の内側 -->
  <rect x="296" y="156" width="75" height="100" rx="3" ry="3" fill="#7CFC00" />
  
  <!-- ピカチュウのシルエット -->
  <circle cx="178" cy="200" r="20" fill="#222222" />
  
  <!-- データ表示のテキスト -->
  <rect x="306" y="176" width="55" height="6" rx="1" ry="1" fill="#222222" />
  <rect x="306" y="191" width="55" height="6" rx="1" ry="1" fill="#222222" />
  <rect x="306" y="206" width="55" height="6" rx="1" ry="1" fill="#222222" />
  <rect x="306" y="221" width="40" height="6" rx="1" ry="1" fill="#222222" />
  
  <!-- ライト表示 -->
  <circle cx="153" cy="136" r="8" fill="#29B6F6" />
  <circle cx="153" cy="136" r="4" fill="#81D4FA" />
  
  <!-- ゲームのような十字キー配置 -->
  <circle cx="161" cy="300" r="8" fill="#222222" /> <!-- 右ボタン -->
  <circle cx="136" cy="300" r="8" fill="#222222" /> <!-- 左ボタン -->
  <circle cx="148.5" cy="287.5" r="8" fill="#222222" /> <!-- 上ボタン -->
  <circle cx="148.5" cy="312.5" r="8" fill="#222222" /> <!-- 下ボタン -->
  
  <!-- 簡略化したスピーカーライン -->
  <rect x="306" y="290" width="55" height="3" rx="1" ry="1" fill="#222222" />
  <rect x="306" y="300" width="55" height="3" rx="1" ry="1" fill="#222222" />
  <rect x="306" y="310" width="55" height="3" rx="1" ry="1" fill="#222222" />
</svg>